# monitoring/prometheus.yml
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: sentinel-gujarat
    env: prod

scrape_configs:

  - job_name: sentinel-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: sentinel-worker
    static_configs:
      - targets: ['worker:8000']
    metrics_path: /metrics

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres:9187']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis:9121']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
