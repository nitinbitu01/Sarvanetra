version: '3.8'

services:
  # 1. Sentinel API & Core Ingestion Node
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api-server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_ENV=production
      - SENTINEL_PORT=8000
      - DATABASE_URL=postgresql://sentinel_admin:SentinelSecure2026@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SENTINEL_ORT_GPU=0
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Production PostgreSQL 16 with PostGIS & pgvector
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: SentinelSecure2026
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Sentinel Cluster State
  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Prometheus Monitoring & Telemetry
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sentinel-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
