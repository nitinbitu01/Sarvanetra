# =============================================================================
# SENTINEL GUJARAT — PRODUCTION DOCKER COMPOSE
# =============================================================================
# Services:
#   Infrastructure  : postgres (pgvector), redis, minio
#   Backend         : api (FastAPI), worker (ANPR/ReID/behavior)
#   Monitoring      : prometheus, grafana, loki (log aggregation)
#   Admin           : pgadmin, redis-commander (--profile admin)
#
# Quick start:
#   cp .env.docker .env.docker.local    # then fill real secrets
#   docker compose --env-file .env.docker.local up -d
#   docker compose --env-file .env.docker.local --profile monitoring up -d
#   docker compose --env-file .env.docker.local --profile admin up -d
# =============================================================================

# ─── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  sentinel_output:
  sentinel_models:
  sentinel_evidence:
  sentinel_hls:

# ─── Shared network ───────────────────────────────────────────────────────────
networks:
  sentinel_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  # ===========================================================================
  # INFRASTRUCTURE LAYER
  # ===========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sentinel}
      POSTGRES_USER:     ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  redis:
    image: redis:7.2-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          memory: 600m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: sentinel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-sentineladmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER:       "on"
      MINIO_SITE_NAME:     sentinel-gujarat
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  minio-init:
    image: minio/mc:latest
    container_name: sentinel_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-sentineladmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/sentinel-evidence &&
        mc mb --ignore-existing local/sentinel-frames &&
        mc mb --ignore-existing local/sentinel-reports &&
        mc mb --ignore-existing local/sentinel-models &&
        mc anonymous set download local/sentinel-frames &&
        echo 'Buckets ready.'
    networks:
      - sentinel_net

  # ===========================================================================
  # APPLICATION LAYER
  # ===========================================================================

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        INSTALL_TORCHREID: "false"
    image: sentinel-api:latest
    container_name: sentinel_migrate
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        python -m backend.db.seed_admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      POSTGRES_URL: "postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      JWT_SECRET:   ${JWT_SECRET}
      ENV:          ${ENV:-prod}
    networks:
      - sentinel_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        INSTALL_TORCHREID: ${INSTALL_TORCHREID:-false}
    image: sentinel-api:latest
    container_name: sentinel_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV:          ${ENV:-prod}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      POSTGRES_URL: "postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sentineladmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE:     "false"
      S3_EVIDENCE_BUCKET: sentinel-evidence
      S3_FRAMES_BUCKET:   sentinel-frames
      S3_REPORTS_BUCKET:  sentinel-reports
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS:     ${CORS_ORIGINS:-http://localhost:5173}
      REID_AUTO_MERGE_THRESHOLD:    ${REID_AUTO_MERGE_THRESHOLD:-0.85}
      REID_REVIEW_LOWER_THRESHOLD:  ${REID_REVIEW_LOWER_THRESHOLD:-0.65}
      REID_APPEARANCE_STALE_HOURS:  ${REID_APPEARANCE_STALE_HOURS:-6}
      REID_RETENTION_DAYS:          ${REID_RETENTION_DAYS:-90}
      IQ_NIGHT_START_HOUR:          ${IQ_NIGHT_START_HOUR:-20}
      IQ_NIGHT_END_HOUR:            ${IQ_NIGHT_END_HOUR:-6}
      IQ_TIMEZONE_OFFSET_HOURS:     ${IQ_TIMEZONE_OFFSET_HOURS:-5.5}
      IQ_CROSS_ZONE_WINDOW_MINUTES: ${IQ_CROSS_ZONE_WINDOW_MINUTES:-30}
      OWNERSHIP_RADIUS_METERS:      ${OWNERSHIP_RADIUS_METERS:-2.0}
      ABANDON_DURATION_SEC:         ${ABANDON_DURATION_SEC:-60.0}
      STATIC_MOVEMENT_PX_THRESHOLD: ${STATIC_MOVEMENT_PX_THRESHOLD:-10.0}
      ABANDON_PROXIMITY_WINDOW_SEC: ${ABANDON_PROXIMITY_WINDOW_SEC:-2.0}
      DEMO_MODE:                    ${DEMO_MODE:-false}
      LOITERING_THRESHOLD_SECONDS:  ${LOITERING_THRESHOLD_SECONDS:-30}
      PROMETHEUS_ENABLED: "true"
    volumes:
      - sentinel_output:/app/output
      - sentinel_models:/app/models
      - sentinel_evidence:/app/evidence
      - sentinel_hls:/app/hls
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "10"}

  worker:
    image: sentinel-api:latest
    container_name: sentinel_worker
    restart: unless-stopped
    command: ["python", "-m", "backend.workers.main"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      ENV:          ${ENV:-prod}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      POSTGRES_URL: "postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379/0"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sentineladmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE:     "false"
      JWT_SECRET:       ${JWT_SECRET}
      REID_AUTO_MERGE_THRESHOLD:   ${REID_AUTO_MERGE_THRESHOLD:-0.85}
      REID_REVIEW_LOWER_THRESHOLD: ${REID_REVIEW_LOWER_THRESHOLD:-0.65}
      DEMO_MODE:                   ${DEMO_MODE:-false}
      RETRAIN_CRON:                ${RETRAIN_CRON:-0 2 * * *}
      HITL_VAULT_MIN_SAMPLES:      ${HITL_VAULT_MIN_SAMPLES:-50}
    volumes:
      - sentinel_output:/app/output
      - sentinel_models:/app/models
      - sentinel_evidence:/app/evidence
      - sentinel_hls:/app/hls
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "10"}

  # ===========================================================================
  # MONITORING LAYER  (start with: --profile monitoring)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinel_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - sentinel_net
    profiles: [monitoring]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  grafana:
    image: grafana/grafana:10.4.3
    container_name: sentinel_grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_INSTALL_PLUGINS:         grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sentinel_net
    profiles: [monitoring]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  loki:
    image: grafana/loki:2.9.8
    container_name: sentinel_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - sentinel_net
    profiles: [monitoring]

  promtail:
    image: grafana/promtail:2.9.8
    container_name: sentinel_promtail
    restart: unless-stopped
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sentinel_net
    profiles: [monitoring]

  # ===========================================================================
  # ADMIN TOOLS  (start with: --profile admin)
  # ===========================================================================

  pgadmin:
    image: dpage/pgadmin4:8.8
    container_name: sentinel_pgadmin
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./monitoring/pgadmin_servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - sentinel_net
    profiles: [admin]

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel_redis_commander
    restart: unless-stopped
    depends_on: [redis]
    environment:
      REDIS_HOSTS:     "local:redis:6379:0:${REDIS_PASSWORD}"
      HTTP_USER:       ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD:   ${REDIS_COMMANDER_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - sentinel_net
    profiles: [admin]
